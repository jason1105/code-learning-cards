name: Daily Learning Card

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  generate-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests anthropic

      - name: Resolve GitHub token for starred repos
        env:
          CUSTOM_TOKEN: ${{ secrets.CARDS_GITHUB_TOKEN }}
        run: |
          if [ -n "$CUSTOM_TOKEN" ]; then
            echo "CARDS_GITHUB_TOKEN=$CUSTOM_TOKEN" >> $GITHUB_ENV
          else
            echo "CARDS_GITHUB_TOKEN=${{ github.token }}" >> $GITHUB_ENV
          fi

      - name: Generate learning card
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: python generate_card.py

      - name: Commit and push updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/latest.json cards/archive.json
          git diff --staged --quiet || git commit -m "Daily learning card - $(date -u +%Y-%m-%d)"
          git push
