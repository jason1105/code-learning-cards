name: Daily Learning Card

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  generate-card:
    runs-on: ubuntu-latest
    permissions:
      issues: write   # 失败告警需要开 issue
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests openai

      - name: Resolve GitHub token for starred repos
        env:
          CUSTOM_TOKEN: ${{ secrets.CARDS_GITHUB_TOKEN }}
        run: |
          if [ -n "$CUSTOM_TOKEN" ]; then
            echo "CARDS_GITHUB_TOKEN=$CUSTOM_TOKEN" >> $GITHUB_ENV
          else
            echo "CARDS_GITHUB_TOKEN=${{ github.token }}" >> $GITHUB_ENV
          fi

      - name: Generate learning card
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: python generate_card.py

      - name: Commit and push updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/latest.json cards/archive.json
          git diff --staged --quiet || git commit -m "Daily learning card - $(date -u +%Y-%m-%d)"
          # --- 改造：bot 不再直推 main，改为开 PR 并自动合并 ---
          git fetch origin main --depth=1 -q
          if [ -z "$(git log FETCH_HEAD..HEAD --oneline)" ]; then
            echo "No new commits; nothing to do."
            exit 0
          fi
          BRANCH="bot/$(date -u +%Y%m%d-%H%M%S)"
          git push -u origin "HEAD:$BRANCH"
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          gh pr create --base main --head "$BRANCH" \
            --title "$(git log -1 --pretty=%s)" \
            --body "Automated update by workflow: ${{ github.workflow }}"
          gh pr merge "$BRANCH" --squash --delete-branch


      - name: Notify on failure

        if: failure()

        env:

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          TITLE="⚠️ 工作流 ${{ github.workflow }} 运行失败"

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BODY="[${{ github.workflow }}]($RUN_URL) 于 $(date -u '+%Y-%m-%d %H:%M UTC') 失败（分支 ${{ github.ref_name }}，触发 ${{ github.event_name }}）。请查看日志。"

          EXISTING=$(gh issue list --state open --search "in:title $TITLE" --json number,title \

                     --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number")

          if [ -n "$EXISTING" ]; then

            gh issue comment "$EXISTING" --body "$BODY"

          else

            gh label create ci-failure --color d73a4a --description "自动化工作流失败告警" 2>/dev/null || true

            gh issue create --title "$TITLE" --body "$BODY" --label ci-failure 2>/dev/null \

              || gh issue create --title "$TITLE" --body "$BODY"

          fi

